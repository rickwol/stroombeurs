<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stroombeurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080d;--bg2:#0d0f17;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
--ink:#f3f5fb;--mute:#8d95aa;--volt:#d4ff3a;--volt-ink:#0b0d06;--acc:#8f7bff;--acc-ink:#fff;--px:#ff4d6d;--ok:#3ee59a;
--disp:"Open Sans",Arial,sans-serif;--mono:"Open Sans",Arial,sans-serif}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(143,123,255,.12),transparent 60%),var(--bg);color:var(--ink);font:16px/1.55 "Open Sans",Arial,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance;font-family:var(--disp);font-weight:800;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.4vw,52px);font-weight:800}
h2{font-size:20px}h3{font-size:16px}
p{margin:.3em 0}
a{color:var(--volt)}
code{font-family:var(--mono);background:var(--glass2);padding:1px 6px;border-radius:6px;font-size:.9em}
.mute{color:var(--mute)}.small{font-size:14px}
/* hero with live scene */
#hero{position:relative;height:var(--heroH,clamp(280px,40vh,420px));overflow:hidden;isolation:isolate}
body[data-view=student] #hero{--heroH:230px}
body[data-view=landing] #hero{--heroH:min(52vh,460px)}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
#hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to bottom,transparent,var(--bg));z-index:-1;pointer-events:none}
#heroIn{height:100%;max-width:1360px;margin:0 auto;padding:18px max(4vw,16px) 22px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.hero-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.hero-main{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--volt);letter-spacing:.1em;margin:0 0 6px}
.clock{font-family:var(--disp);font-weight:800;font-size:clamp(48px,8vw,104px);line-height:.95;letter-spacing:-.035em}
body[data-view=student] .clock{font-size:52px}
.scen{font-family:var(--disp);font-size:clamp(18px,2.2vw,26px);font-weight:700;margin:6px 0 2px}
.ev{max-width:60ch;color:#dfe4f2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{font-family:var(--mono);font-size:13px;background:rgba(7,8,13,.55);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-shadow:none}
.chips b{color:var(--volt);font-weight:700}
.timer{font-family:var(--disp);font-weight:800;font-size:clamp(34px,5vw,64px);white-space:nowrap;color:var(--volt)}
body[data-view=student] .timer{font-size:34px}
.wrap{max-width:1360px;margin:0 auto;padding:8px max(4vw,16px) 48px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 20px 60px -30px rgba(0,0,0,.8)}
.stack-v>*+*{margin-top:16px}
.fig{position:relative;min-height:440px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.big{font-family:var(--disp);font-size:clamp(44px,7vw,84px);font-weight:800;line-height:1;color:var(--px);letter-spacing:-.03em;white-space:nowrap;text-shadow:0 0 40px rgba(255,77,109,.45)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:46px;padding:0 18px;cursor:pointer;background:var(--glass2);color:var(--ink);border:1px solid var(--line);transition:transform .15s,box-shadow .2s,background .2s;text-shadow:none}
button:hover:not(:disabled){transform:translateY(-1px)}
button.ghost{background:rgba(7,8,13,.45);backdrop-filter:blur(10px)}
button.acc{background:var(--volt);color:var(--volt-ink);border-color:transparent;box-shadow:0 0 0 1px rgba(212,255,58,.3),0 10px 40px -8px rgba(212,255,58,.55)}
button.px{background:var(--px);color:#fff;border-color:transparent;box-shadow:0 10px 40px -8px rgba(255,77,109,.6)}
button:disabled{opacity:.4;cursor:default;transform:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 14px;width:100%}
input[type=number]{font-family:var(--mono);font-weight:700}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--volt)}
label{font-weight:600;font-size:14px;display:block;margin-bottom:8px;color:#cfd5e4}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 12px currentColor}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px 5px 8px;background:var(--glass);border:1px solid var(--line);font-size:14px;min-height:34px;opacity:.55}
.chip.on{opacity:1;border-color:rgba(62,229,154,.6);box-shadow:0 0 18px -4px rgba(62,229,154,.6)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pl{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;animation:pop .35s ease-out both}
.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rolebtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin-top:4px;min-height:32px;padding:0 10px;font-size:13px;font-weight:500;border-radius:10px}
.x{min-height:34px;width:34px;padding:0;background:transparent;border:0;color:var(--mute);font-size:20px}
.lb{display:grid;gap:4px}.lb div{display:grid;grid-template-columns:24px 12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;padding:6px 8px;border-radius:10px}
.lb div:first-child{background:rgba(212,255,58,.08)}
.lb b{white-space:nowrap;font-family:var(--mono)}.lb em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb span.mute:first-child{font-family:var(--mono)}
.hist div{display:grid;grid-template-columns:56px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:14px;font-family:var(--mono)}
.hist i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--volt));box-shadow:0 0 16px -4px var(--volt);animation:bar .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.hist i.neg{background:var(--px)}
.hist span:last-child{text-align:right;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#cfd5e4}
.event{border-left:3px solid var(--px);padding:4px 0 4px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--volt);color:var(--volt-ink);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
.phone{max-width:520px;margin:0 auto;padding:4px 14px 40px}
.rolecard{border-radius:22px;padding:20px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 38%,#0b0d14),#0b0d14 75%);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:0 0 60px -20px var(--rc)}
.rolecard svg{position:absolute;right:-6px;top:-6px;width:130px;height:130px;opacity:.9;filter:drop-shadow(0 0 18px var(--rc))}
.rolecard svg *{fill:var(--rc);stroke:var(--rc)}
.rolecard svg [fill=none]{fill:none}
.rolecard h2{font-size:26px;color:var(--rc);max-width:75%}
.rolecard p{color:#dde2ee}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.35);border-radius:14px;padding:4px}
.seg button{background:transparent;border:0;min-height:42px}
.seg button.on{background:var(--volt);color:var(--volt-ink)}
.pin{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px}
.pin button{padding:0}
.status{font-weight:700;color:var(--ok)}
.resline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.resline b{white-space:nowrap;font-family:var(--mono)}
.pos{color:var(--ok)}.neg{color:var(--px)}
details.hint{background:rgba(143,123,255,.1);border:1px solid rgba(143,123,255,.35);border-radius:14px;padding:0 14px}
details.hint summary{min-height:46px;display:flex;align-items:center;font-weight:700;color:#c4b9ff;cursor:pointer}
details.hint p{padding-bottom:12px}
.qrbox{display:grid;place-items:center;padding:14px;background:#fff;border-radius:18px;margin-inline:auto;width:fit-content;box-shadow:0 0 60px -10px rgba(212,255,58,.5)}
.code{font-family:var(--disp);font-weight:800;font-size:clamp(48px,6vw,76px);letter-spacing:.08em;color:var(--volt);text-shadow:0 0 40px rgba(212,255,58,.4)}
.mo-bar.grow{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{transform:scaleY(0);opacity:0}}
@keyframes bar{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.5}}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hero"><canvas id="sky" aria-hidden="true"></canvas><div id="heroIn"></div></header>
<main id="app"><div class="wrap"><p class="mute pulse">Bezig met verbinden met de markt…</p></div></main>
<script>
{
/* ---------- game model ---------- */
const ROLES={
 kern:{n:'Kerncentrale',side:'s',cap:300,col:'#a274ff',tip:'Lage kosten (€12/MWh), maar inflexibel: lever je minder dan 150 MW, dan betaal je €3.000 aan afschakel- en opstartkosten. Soms loont een negatief bod.'},
 wind:{n:'Windpark',side:'s',cap:250,col:'#2de0d0',tip:'Geen brandstofkosten. Je beschikbare vermogen hangt af van de wind. Wat je niet verkoopt, is verloren.'},
 zon:{n:'Zonnepark',side:'s',cap:200,col:'#ffcc33',tip:'Geen brandstofkosten, maar alleen vermogen als de zon schijnt. Pas op voor de middagdip in de prijs.'},
 gas:{n:'Gascentrale',side:'s',cap:400,col:'#8fa3c4',tip:'Flexibel, maar je marginale kosten volgen de gasprijs.'},
 piek:{n:'Piekcentrale',side:'s',cap:150,col:'#ff5b4f',tip:'Draait alleen als het krap is. Hoge kosten, dus je verdient aan schaarsteprijzen.'},
 bat:{n:'Batterij',side:'b',cap:100,col:'#ff4fb8',tip:'100 MW / 200 MWh. Laad goedkoop, ontlaad duur. Bij laden verlies je 10%. Elke ronde kies je laden (kopen) of ontladen (verkopen).'},
 lev:{n:'Energieleverancier',side:'d',col:'#6e83ff',tip:'Je klanten betalen een vast tarief van €140/MWh. Koop je te weinig in, dan betaal je over het tekort de onbalansprijs: minstens €300/MWh, of 2× de marktprijs.'},
 ind:{n:'Industrie',side:'d',cap:250,col:'#38c98d',tip:'Je elektrolyser maakt waterstof die €120 per MWh stroom oplevert. Boven die prijs kun je beter stilstaan.'},
 ev:{n:'Laadplein-exploitant',side:'d',cap:150,col:'#3fa9ff',tip:'Je verkoopt laadstroom aan EV-rijders voor €250/MWh. Over de hele dag moet je 450 MWh laden; elk tekort aan het eind kost €400/MWh. Maximaal 150 MW per ronde.'}
};
const ORDER=['lev','gas','wind','ind','kern','zon','bat','ev','piek'];
const SCEN=[
 {t:'03:00',n:'Nacht',load:.42,wind:.75,zon:0,gas:1,ev:'Rustige nacht met behoorlijk wat wind.'},
 {t:'08:00',n:'Ochtendpiek',load:.85,wind:.45,zon:.25,gas:1,ev:'Iedereen staat op; de zon komt langzaam op.'},
 {t:'13:00',n:'Zonnige middag',load:.52,wind:.35,zon:1,gas:1,ev:'Volle zon op alle panelen. Zakt de prijs onder nul?'},
 {t:'18:00',n:'Windstille avondpiek',load:1,wind:.08,zon:.05,gas:1,ev:'Bijna geen wind, geen zon en de hoogste vraag van de dag.'},
 {t:'20:00',n:'Gasprijsschok',load:.9,wind:.3,zon:0,gas:1.6,ev:'De gasprijs stijgt 60%: de marginale kosten van gascentrales gaan omhoog.'},
 {t:'23:00',n:'Stormnacht',load:.45,wind:1,zon:0,gas:1.6,ev:'Er trekt een storm over: windparken draaien op vol vermogen.'}
];
/* hints: tactiek per rol per ronde (index = ronde-1) */
const HINTS={
 kern:['Weinig vraag en veel wind: de prijs kan laag uitvallen. Onder 150 MW betaal je €3.000. Wat is erger: een uur verkopen onder je kostprijs, of die boete?',
  'De vraag trekt aan. Waarschijnlijk zet een gascentrale de prijs en verdien jij het verschil met je €12. Bied je hele vermogen aan.',
  'Veel zon drukt de prijs. Met een laag of zelfs negatief bod op je minimumlast voorkom je dat je moet afschakelen.',
  'Het krapste uur van de dag. Je hoeft niet hoog te bieden om de hoge prijs te krijgen: iedereen krijgt dezelfde marktprijs (pay-as-clear).',
  'Gas wordt duurder, dus de prijs die gascentrales zetten stijgt. Jouw kosten blijven gelijk: dit is jouw uur.',
  'Storm: wind op vol vermogen en weinig vraag. Grote kans op een heel lage of negatieve prijs. Bescherm je minimumlast.'],
 wind:['Je marginale kosten zijn nul en wat je niet verkoopt, is verloren. Met een bod rond €0 draai je vrijwel altijd.',
  'Matige wind en stijgende vraag: je wordt zeker afgenomen. Hoger bieden levert niets extra op, want je krijgt toch de marktprijs.',
  'Samen met de zonneparken komt er veel gratis stroom op de markt. Hoe laag ben je bereid te gaan?',
  'Bijna geen wind: je hebt weinig te verkopen, maar de prijs is hoog. Bied laag in, dan draai je zeker.',
  'Een hogere gasprijs betekent een hogere marktprijs. Zorg dat je hele vermogen verkocht wordt.',
  'Storm: je beste productie-uur, maar alle windparken draaien tegelijk. Hoe ver kan de prijs zakken? Kijk naar de nacht van vanochtend.'],
 zon:['Het is nacht: je hebt geen vermogen. Kijk hoe de markt zich gedraagt.',
  'De zon komt op: een beetje vermogen, tegen een prijs die waarschijnlijk door gas wordt gezet. Bied laag, dan draai je zeker.',
  'Volle zon: jouw uur, maar ook dat van alle andere zonneparken. Bied een realistisch minimum; een negatieve prijs is mogelijk.',
  'Nauwelijks zon meer. Bied je kleine volume laag in, dan krijg je wel de hoge piekprijs.',
  'Na zonsondergang: geen vermogen.',
  'Nacht: geen vermogen.'],
 gas:['Weinig vraag en veel wind: misschien ben je niet nodig. Bied op je marginale kosten; lager bieden betekent verlies maken.',
  'Ochtendpiek: grote kans dat jij de prijs bepaalt. Iets boven je kosten bieden kan, maar te hoog en de piekcentrale neemt het over.',
  'Zon drukt de prijs. Komt de prijs onder je kosten, dan kun je beter niet draaien.',
  'Krapste uur. De piekcentrale is duurder dan jij: je kunt boven je kosten bieden, zolang je onder die van de piek blijft.',
  'Je kosten zijn 60% gestegen, naar €136/MWh. Pas je bod aan, anders verkoop je met verlies.',
  'Storm en duur gas: grote kans dat je niet nodig bent. Bied niet onder je kosten.'],
 piek:['Rustige nacht: je bent vrijwel zeker niet nodig. Bieden op je kosten kost niets.',
  'Waarschijnlijk niet nodig, tenzij het aanbod tegenvalt. Bied minimaal je kosten.',
  'Middag met veel zon: geen kans. Bied je kosten of sla over.',
  'Dit is jouw uur. Is er zonder jou te weinig aanbod, dan bepaal jij de prijs. Hoe hoog durf je te gaan voordat afnemers afhaken?',
  'Duurder gas maakt ook jou duurder: €240/MWh. Is de markt krap genoeg dat je nodig bent?',
  'Stormnacht: geen kans.'],
 bat:['Veel wind en weinig vraag: vaak een goedkoop uur. Laad als je verwacht later duurder te kunnen verkopen.',
  'Ochtendpiek: duurder dan vannacht. Verkopen kan, maar de avondpiek wordt waarschijnlijk nog duurder.',
  'Volle zon: vaak de laagste prijs van de dag. Laad met een lage maximumprijs.',
  'Hoogste vraag van de dag: ontladen. Waarschijnlijk zetten dure centrales de prijs, dus je minimumprijs mag hoog zijn.',
  'Duur gas houdt de prijs hoog. Heb je nog energie? Verkoop die dan.',
  'Laatste ronde: lading die overblijft, levert niets meer op. Verkoop wat je nog hebt.'],
 lev:['Dek je klantvraag, anders betaal je minstens €300/MWh onbalans. Bied je hele vraag met een ruime maximumprijs.',
  'De vraag stijgt. Te weinig inkopen is duurder dan een hoge maximumprijs: je betaalt de marktprijs, niet je bod.',
  'Lage prijs verwacht. Koop precies je vraag in; te veel inkopen is weggegooid geld.',
  'Krapste uur: bied je te laag, dan krijg je niets en betaal je onbalans. Bied hoog genoeg.',
  'Hoge prijzen door duur gas. Je tarief is €140, dus je maakt hier misschien verlies, maar onbalans is erger.',
  'Stormnacht met een lage prijs verwacht: koop je hele vraag in.'],
 ind:['Weinig vraag en veel wind: kans op een prijs onder €120. Bied maximaal je waarde.',
  'Ochtendpiek: de prijs ligt waarschijnlijk rond de kosten van gas (~€85). Onder €120 maak je nog winst.',
  'Volle zon: mogelijk de goedkoopste stroom van de dag. Koop vol in.',
  'Krapste uur: waarschijnlijk boven €120. Stilstaan is dan beter dan verlies maken.',
  'Duur gas: een prijs boven €120 ligt voor de hand. Overweeg niet te kopen.',
  'Storm: lage prijs verwacht. Draai op vol vermogen.'],
 ev:['Je moet vandaag 450 MWh laden, maximaal 150 per ronde. Een nacht met veel wind is een goed moment om te beginnen.',
  'Ochtendpiek: duurder. Kun je het laden uitstellen naar goedkopere uren? Je hebt nog vier rondes.',
  'Volle zon: waarschijnlijk goedkoop. Laad vol.',
  'Duurste uur van de dag: sla liever over, tenzij je achterloopt met laden.',
  'Duur gas. Hoeveel moet je nog laden? Elke MWh tekort kost straks €400.',
  'Laatste ronde: wat je nu niet laadt, kost €400/MWh boete. Bied genoeg om zeker te laden.']};
const CAP=4000,FLOOR=-500,TARIEF=140,MINRUN=150,BATMAX=200,EVNEED=450,EVPEN=400;
const mc=(r,s)=>r==='kern'?12:r==='gas'?Math.round(85*s.gas):r==='piek'?Math.round(150*s.gas):0;
const demandOf=(st,s)=>Math.round((st.params?.L||0)*s.load);
function maxQ(pl,s,st,m){const r=pl.role;
 if(r==='wind')return Math.round(250*s.wind);if(r==='zon')return Math.round(200*s.zon);
 if(r==='bat')return m==='laden'?Math.max(0,Math.min(100,Math.floor((BATMAX-pl.soc)/.9))):Math.max(0,Math.min(100,Math.floor(pl.soc)));
 if(r==='lev')return Math.round(demandOf(st,s)*1.5);
 return ROLES[r].cap;}
function defBid(pl,s,st){const r=pl.role;
 if(r==='bat'){const m=s.zon>.6||s.load<.6?'laden':'ontladen';return{m,q:maxQ(pl,s,st,m),p:m==='laden'?30:120};}
 if(r==='lev')return{q:demandOf(st,s),p:400};if(r==='ind')return{q:250,p:120};if(r==='ev')return{q:150,p:200};
 return{q:maxQ(pl,s,st),p:mc(r,s)};}
function botBid(pl,s,st){const r=pl.role,j=()=>.9+Math.random()*.35;
 if(r==='kern')return{q:300,p:Math.random()<.5?-20:12};
 if(r==='wind'||r==='zon')return{q:maxQ(pl,s,st),p:Math.round(Math.random()*5)};
 if(r==='gas'||r==='piek')return{q:maxQ(pl,s,st),p:Math.round(mc(r,s)*j())};
 if(r==='bat'){if(s.zon>.6||s.load<.6)return{m:'laden',q:maxQ(pl,s,st,'laden'),p:40};if(s.load>=.85)return{m:'ontladen',q:maxQ(pl,s,st,'ontladen'),p:140};return null;}
 if(r==='lev')return{q:demandOf(st,s),p:600};

 else if(ph==='res'||ph==='end')mid=resultCard(pl,ph==='end');
 app.innerHTML=`<div class="phone stack-v">
  <div class="rolecard" style="--rc:${R.col}"><svg viewBox="0 0 120 120" aria-hidden="true">${ICON[pl.role]}</svg><p class="eyebrow" style="color:var(--rc)">${esc(pl.name).toUpperCase()}</p><h2>${R.n}</h2><p style="max-width:88%;margin-top:10px">${R.tip}</p></div>
  ${mid}
  <div class="card"><div class="resline"><span>Totaal resultaat</span><b class="${pl.tot<0?'neg':'pos'}">${eur(pl.tot)}</b></div><div class="resline" style="border:0"><span>Positie</span><b>${rank} van ${n}</b></div></div></div>`;
 bindForm(pl,s);const hd=$('details.hint');if(hd){hd.open=hintOpenRound===state.round;hd.addEventListener('toggle',()=>{hintOpenRound=hd.open?state.round:0;});}updStudent();}
let hintOpenRound=0;
function facts(pl,s){const r=pl.role,f=[];
 if(ROLES[r].side==='s'){f.push(['Beschikbaar vermogen',num(maxQ(pl,s,state))+' MW']);f.push(['Marginale kosten',eur(mc(r,s))+'/MWh']);}
 if(r==='bat')f.push(['Laadtoestand',num(pl.soc)+' / '+BATMAX+' MWh']);
 if(r==='lev')f.push(['Vraag van je klanten',num(demandOf(state,s))+' MW']);
 if(r==='ind')f.push(['Waarde van je product','€120/MWh']);
 if(r==='ev')f.push(['Al geladen',num(pl.chg)+' van '+EVNEED+' MWh'],['Rondes over',SCEN.length-state.round+1]);
 return f.map(([a,b])=>`<div class="resline"><span>${a}</span><b>${b}</b></div>`).join('');}
function bidForm(pl,s){const k=state.round+'|'+pl.role;if(draftKey!==k){draft=defBid(pl,s,state);draftKey=k;}
 const sell=pl.role==='bat'?draft.m==='ontladen':ROLES[pl.role].side==='s';const mx=maxQ(pl,s,state,draft.m);if(draft.q>mx)draft.q=mx;
 const prev=state.result?`<p class="mute small">Vorige ronde (${SCEN[state.result.round-1].t}): ${state.result.P==null?'geen handel':eur(state.result.P)+'/MWh'}</p>`:'';
 return`<div class="card stack-v"><p class="event">${esc(s.ev)}</p>${prev}<div>${facts(pl,s)}</div>${state.hints!==false&&HINTS[pl.role]?`<details class="hint"><summary>Hint: tactiek voor deze ronde</summary><p>${HINTS[pl.role][state.round-1]||''}</p></details>`:''}</div>
 <form class="card stack-v" id="bid">
  ${pl.role==='bat'?`<div class="seg"><button type="button" data-m="laden" class="${draft.m==='laden'?'on':''}">Laden (kopen)</button><button type="button" data-m="ontladen" class="${draft.m==='ontladen'?'on':''}">Ontladen (verkopen)</button></div>`:''}
  <div><label for="q">${sell?'Hoeveel wil je verkopen?':'Hoeveel wil je kopen?'} <span class="mute">(max ${num(mx)} MW)</span></label>
   <div class="row" style="flex-wrap:nowrap"><input type="range" id="qr" min="0" max="${mx}" step="5" value="${draft.q}" aria-label="Volume schuif"><input id="q" type="number" inputmode="numeric" min="0" max="${mx}" value="${draft.q}" style="width:110px;flex:none"></div></div>
  <div><label for="p">${sell?'Minimumprijs (€/MWh)':'Maximumprijs (€/MWh)'}</label>
   <div class="pin"><button type="button" class="ghost" data-d="-10" aria-label="10 lager">−</button><input id="p" type="number" inputmode="numeric" min="${FLOOR}" max="${CAP}" value="${draft.p}"><button type="button" class="ghost" data-d="10" aria-label="10 hoger">+</button></div>
   <p class="mute small">${sell?'Je verkoopt alleen als de marktprijs minstens dit bedrag is.':'Je koopt alleen als de marktprijs hooguit dit bedrag is.'} Tussen ${FLOOR} en ${CAP}.</p></div>
  <button class="acc" type="submit" id="sub">Bod indienen</button><p class="status" id="st" aria-live="polite"></p></form>`;}
function bindForm(pl,s){const f=$('#bid');if(!f)return;const q=$('#q'),qr=$('#qr'),p=$('#p');
 const dirty=()=>{if(submittedFor===draftKey){submittedFor='';lastSig='';}updStudent();};
 qr.addEventListener('input',()=>{q.value=qr.value;draft.q=+qr.value;dirty();});
 q.addEventListener('input',()=>{qr.value=q.value;draft.q=+q.value;dirty();});
 p.addEventListener('input',()=>{draft.p=+p.value;dirty();});
 f.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{draft.p=Math.max(FLOOR,Math.min(CAP,(+p.value||0)+ +b.dataset.d));p.value=draft.p;dirty();}));
 f.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{draft.m=b.dataset.m;draft.q=maxQ(pl,s,state,draft.m);draft.p=draft.m==='laden'?30:120;submittedFor='';lastSig='';render();}));
 f.addEventListener('submit',e=>{e.preventDefault();const b=sanitize(draft,pl,s,state);if(!b)return toast('Vul een geldig volume en een geldige prijs in');
  G.child('bids/'+state.round+'/'+uid).set(pl.role==='bat'?{q:b.q,p:b.p,m:b.m}:{q:b.q,p:b.p}).then(()=>{submittedFor=draftKey;lastSig='';render();}).catch(()=>toast('Indienen mislukt. Is de markt al gesloten?'));});}
function updStudent(){const st=$('#st'),sub=$('#sub');if(st){const done=submittedFor===draftKey;st.textContent=done?'Bod ingediend. Je kunt het nog aanpassen tot de markt sluit.':'';if(sub)sub.textContent=done?'Bod bijwerken':'Bod indienen';}tick();}
function resultCard(pl,end){const L=pl.last,res=state.result;
 if(end)return`<div class="card stack-v"><h2>Einde handelsdag</h2>${pl.pen?`<p class="neg">Boete voor ${num(EVNEED-pl.chg)} MWh die je niet hebt geladen: ${eur(pl.pen)}</p>`:''}${pl.pct!=null?`<div><div class="resline"><span>Score</span><b>${pctTxt(pl.pct)} van je potentieel</b></div>${pl.role==='lev'?`<div class="resline"><span>Jouw inkoopkosten</span><b>${eur(pl.cost||0)}</b></div><div class="resline"><span>Ideale inkoopkosten</span><b>${eur(pl.pot)}</b></div>`:`<div class="resline"><span>Jouw resultaat</span><b>${eur(pl.tot)}</b></div><div class="resline"><span>Maximaal haalbaar</span><b>${eur(pl.pot)}</b></div>`}</div>${pl.tag?'<p class="mute small">Je had vandaag geen winstkans; zonder verlies scoor je 100%.</p>':''}`:''}<p class="mute">Kijk naar het scherm voor de eindstand en de nabespreking.</p></div>`;
 if(!L||L.r!==state.round)return`<div class="card"><p class="mute">Je hebt deze ronde niet geboden.</p></div>`;
 const sell=pl.role==='bat'?L.bid?.m==='ontladen':ROLES[pl.role].side==='s';
 return`<div class="card stack-v"><h2>Uitslag ${SCEN[state.round-1].t}</h2><div><div class="resline"><span>Marktprijs</span><b>${res?.P==null?'geen handel':eur(res.P)+'/MWh'}</b></div>
  <div class="resline"><span>Jouw bod</span><b>${L.bid?num(L.bid.q)+' MW @ '+eur(L.bid.p):'geen bod'}</b></div>
  <div class="resline"><span>${sell?'Verkocht':'Gekocht'}</span><b>${num(L.q)} MW</b></div>
  <div class="resline"><span>Resultaat deze ronde</span><b class="${L.pr<0?'neg':'pos'}">${eur(L.pr)}</b></div></div>${L.note?`<p class="mute small">${esc(L.note)}</p>`:''}<p class="mute small pulse">Wachten op de volgende ronde…</p></div>`;}

/* ---------- teacher events ---------- */
document.addEventListener('click',e=>{if(!teacher)return;const t=e.target.closest('button');if(!t||!state)return;const a=t.dataset.a;
 if(a!=='reset')confirmReset=false;
 if(a==='start')startGame();else if(a==='close')closeMarket();else if(a==='next')nextRound();
 else if(a==='t60')setTimer(60);else if(a==='t90')setTimer(90);else if(a==='bots')addBots();else if(a==='hints'){const st=clone(state);st.hints=state.hints===false;save(st);}
 else if(a==='reset'){if(confirmReset){confirmReset=false;G.child('bids').remove().catch(()=>{});const st=freshState();for(const[k,p]of Object.entries(state.players))if(!p.bot)st.players[k]={name:p.name,role:p.role,tot:0,soc:100,chg:0,last:null};save(st);}else{confirmReset=true;render();}}
 else if(t.dataset.role){const st=clone(state),p=st.players[t.dataset.role];if(p){p.role=ORDER[(ORDER.indexOf(p.role)+1)%ORDER.length];save(st);}}
 else if(t.dataset.del){const k=t.dataset.del,st=clone(state);delete st.players[k];if(!k.startsWith('bot-'))G.child('players/'+k).remove().catch(()=>{});save(st);}});

/* ---------- landing & setup ---------- */
function heroSimple(t,sub){document.body.dataset.view='landing';setScene(0,{show:true});setHero(`<div class="hero-top"><div class="brand">${BOLT}Stroombeurs</div></div><div class="hero-main"><div><p class="eyebrow">${sub}</p><h1 class="clock" style="font-size:clamp(44px,8vw,96px)">${t}</h1></div></div>`);}
function renderSetup(){heroSimple('Stroombeurs','SETUP');$('#app').innerHTML=`<div class="phone stack-v"><div class="card stack-v"><p><b>Nog niet gekoppeld aan Firebase.</b></p><p class="mute">Vul je Firebase-gegevens in <code>config.js</code> in. De stappen staan in de README.</p></div></div>`;}
function renderLanding(){const last=store.get('sb-last-game');
 heroSimple('Stroombeurs','HANDELSSPEL · DAY-AHEAD ELEKTRICITEITSMARKT');$('#app').innerHTML=`<div class="phone stack-v">
 <form class="card stack-v" id="code"><h2>Meedoen als student</h2><div><label for="c">Spelcode</label><input id="c" maxlength="6" autocapitalize="characters" autocomplete="off" required></div><button class="acc" type="submit">Naar het spel</button></form>
 <div class="card stack-v"><h2>Docent</h2><p class="mute small">Start een nieuw spel en laat studenten de QR-code scannen.</p><button id="new">Nieuw spel starten</button>
 ${last?`<button class="ghost" id="last">Terug naar spel ${esc(last)}</button>`:''}</div></div>`;
 $('#code').addEventListener('submit',e=>{e.preventDefault();const c=$('#c').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.search='?spel='+c;});
 $('#new').addEventListener('click',createGame);$('#last')?.addEventListener('click',()=>location.search='?spel='+last);}
async function createGame(){const b=$('#new');if(b)b.disabled=true;
 for(let i=0;i<6;i++){const c=Array.from({length:4},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
  try{await fdb.ref('owners/'+c).set(uid);await fdb.ref('games/'+c+'/state').set(JSON.parse(JSON.stringify(freshState())));store.set('sb-last-game',c);location.search='?spel='+c;return;}catch(e){if(i===5)toast('Spel aanmaken mislukt: '+(e?.code||'fout'));}}
 if(b)b.disabled=false;}

/* ---------- boot ---------- */
(async()=>{
 const cfg=window.FIREBASE_CONFIG;
 if(!window.firebase||!cfg||!cfg.apiKey||/VUL|YOUR/i.test(cfg.apiKey)){renderSetup();return;}
 try{firebase.initializeApp(cfg);fdb=firebase.database();await firebase.auth().signInAnonymously();uid=firebase.auth().currentUser.uid;}
 catch(e){heroSimple('Stroombeurs','VERBINDING');$('#app').innerHTML=`<div class="phone"><div class="card"><p><b>Verbinden met Firebase mislukt.</b></p><p class="mute">${esc(e?.code||e?.message||'')}</p><p class="mute small">Staat anoniem inloggen aan in Firebase Authentication?</p></div></div>`;return;}
 fdb.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
 const qs=new URLSearchParams(location.search);code=(qs.get('spel')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
 if(!code){renderLanding();return;}
 const owner=(await fdb.ref('owners/'+code).get().catch(()=>null))?.val();
 if(!owner){heroSimple('Stroombeurs','SPEL NIET GEVONDEN');$('#app').innerHTML=`<div class="phone stack-v"><div class="card"><p><b>Spel ${esc(code)} bestaat niet.</b></p><p class="mute">Controleer de code bij je docent.</p><p><a href="${esc(location.pathname)}">Andere code invoeren</a></p></div></div>`;return;}
 teacher=owner===uid&&!qs.has('speler');me.key=uid;G=fdb.ref('games/'+code);
 if(teacher)store.set('sb-last-game',code);
 const tm=setTimeout(()=>{if(!loaded){loaded=true;toast('De markt reageert nog niet. Even geduld…');render();}},10000);
 G.child('state').on('value',s=>{clearTimeout(tm);loaded=true;state=norm(s.val());syncPlayers();watchMyBid();schedule();},e=>{clearTimeout(tm);loaded=true;toast('Marktdata niet bereikbaar ('+(e?.code||'fout')+')');schedule();});
 G.child('players').on('value',s=>{playersNode=s.val()||{};syncPlayers();schedule();},()=>{});
 if(teacher)G.child('bids').on('value',s=>{bidsNode=s.val()||{};schedule();},e=>toast('Biedingen niet leesbaar ('+(e?.code||'fout')+')'));
 else{const nm=store.get('sb-name-'+code);if(nm)join(nm);
  fdb.ref('.info/connected').on('value',s=>{if(s.val()&&joined)G.child('players/'+uid).update({on:true}).catch(()=>{});});}
 render();
})();
}
</script>
</body>
